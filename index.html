<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broome Dispatch: Gang Wars</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚔 Broome Dispatch: Gang Wars</h1>

<div class="stats">
    <div>Day: <span id="day">1</span></div>
    <div>Safety: <span id="safety">100</span>%</div>
    <div>Gang Threat: <span id="threat">1</span></div>
    <div>Funds: $<span id="money">1000</span></div>
    <div>Deaths: <span id="deaths">0</span></div>
</div>

<div id="map">

    <img
        id="mapImage"
        src="assets/broome_map.svg"
        alt="Broome Map">

    <img
        id="police1"
        class="unit"
        src="assets/police1.jpg"
        alt="Police">

    <img
        id="fire1"
        class="unit"
        src="assets/fire1.jpg"
        alt="Fire">

    <img
        id="ambo1"
        class="unit"
        src="assets/ambo1.jpg"
        alt="Ambulance">

</div>

<div class="units">

    <div>
        🚔 Police:
        <span id="police">6</span>
    </div>

    <div>
        🚒 Fire:
        <span id="fire">3</span>
    </div>

    <div>
        🚑 Ambulance:
        <span id="ambo">4</span>
    </div>

</div>

<div id="incident" class="incident">
    Ready for dispatch.
</div>

<div class="buttons">

    <button onclick="dispatchPolice()">
        Dispatch Police
    </button>

    <button onclick="dispatchFire()">
        Dispatch Fire
    </button>

    <button onclick="dispatchAmbulance()">
        Dispatch Ambulance
    </button>

</div>

<h2>Dispatch Log</h2>

<div id="log"></div>

<script src="script.js"></script>

</body>
</html>
