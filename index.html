<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Broome Dispatch: Gang Wars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚔 Broome Dispatch: Gang Wars</h1>
<div id="map">
    <img src="assets/broome_map.jpg">

    <img
        id="police1"
         class="unit"
         src="assets/police1.jpg"
    
    id="fire1"
        class="unit"
        src="assets/fire1.jpg"
    
    id="ambo1"
        class="unit"
        src="assets/ambo1.jpg">

</div>

<div class="stats">
    <div>Day: <span id="day">1</span></div>
    <div>Safety: <span id="safety">100</span>%</div>
    <div>Gang Threat: <span id="threat">1</span></div>
    <div>Funds: $<span id="money">1000</span></div>
    <div>Deaths: <span id="deaths">0</span></div>
</div>

    <div class="unit">
        <img src="assets/police.jpg" class="jpeg">
        <span id="police">6</span>
    </div>

    <div class="unit">
        <img src="assets/fire.jpg" class="jpeg">
        <span id="fire">3</span>
    </div>

    <div class="unit">
        <img src="assets/ambo.jpg" class="jpeg">
        <span id="ambo">4</span>

</div>

</div>

<div id="incident" class="incident"></div>

<div class="buttons">
    <button onclick="dispatchIncident()">Dispatch</button>
    <button onclick="ignoreIncident()">Ignore</button>
</div>

<h2>Dispatch Log</h2>
<div id="log"></div>

<script src="script.js"></script>

</body>
</html>
